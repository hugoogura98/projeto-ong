<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2a8f6f">
  <title>Cadastro — ONG Viver de Novo</title>
  <meta name="description" content="Cadastre-se como voluntário ou apoiador da ONG Viver de Novo.">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container" style="position:relative;">
      <div style="display:flex;align-items:center;gap:1rem">
        <a href="index.html" class="logo-link" aria-label="Página inicial">
          <img src="images/logo.png" alt="Viver de Novo" class="logo-img">
        </a>
      </div>
      <nav id="main-nav" class="main-nav" role="navigation" aria-label="Menu principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="cadastro.html">Cadastre-se</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" id="main" role="main">
    <h1>Cadastro</h1>
    <p>Preencha seus dados para se candidatar a oportunidades de voluntariado ou ficar como apoiador.</p>

    <form id="cadastro-form" action="#" method="post" novalidate>
      <fieldset>
        <legend>Dados pessoais</legend>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required minlength="2">

        <label for="email">E‑mail</label>
        <input type="email" id="email" name="email" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" inputmode="tel" required placeholder="(00) 00000-0000">

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" inputmode="numeric" required placeholder="00000-000">

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" required>

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="estado">Estado</label>
        <select id="estado" name="estado" required>
          <option value="">Selecione</option>
          <option value="SP">SP</option>
          <option value="RJ">RJ</option>
          <option value="MG">MG</option>
          <option value="BA">BA</option>
        </select>
      </fieldset>

      <button type="submit">Enviar cadastro</button>
    </form>

  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>&copy; ONG Viver de Novo</p>
    </div>
  </footer>

</body>
</html>
